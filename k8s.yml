- hosts: all
  become: yes
  tasks:
  - name: Remove swapfile from /etc/fstab
    mount:
      name: swap
      fstype: swap
      state: absent

  - name: Disable swap
    command: swapoff -a
    when: ansible_swaptotal_mb > 0
    
  - name: set up authorized keys for root user
    authorized_key: user=root key="{{item}}"
    with_file:
      - ~/.ssh/id_rsa.pub

  - name: Assign inventory name to unconfigured hostnames (non-CoreOS, Suse and ClearLinux)
    hostname:
      name: "{{ inventory_hostname }}"

  - name: "Add IP address of all hosts to all hosts"
    lineinfile:
      dest: /etc/hosts
      regexp: '.*{{ item }}$'
      line: "{{ hostvars[item].ansible_host }} {{item}}"
      state: present
    when: hostvars[item].ansible_host is defined
    with_items: "{{ groups.all }}"

- hosts: all[0]
  become: yes
  tasks:
    - name: initialize the cluster
      shell: kubeadm init --kubernetes-version v1.36.2

    - name: create .kube directory
      become: yes
      file:
        path: $HOME/.kube
        state: directory
        mode: 0755

    - name: copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root

- hosts: all[0]
  become: yes
  gather_facts: false
  tasks:
    - name: get join command
      shell: kubeadm token create --print-join-command
      register: join_command_raw

    - name: set join command
      set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"

- hosts: all[1:]
  become: yes
  tasks:
    - name: join cluster
      shell: "{{ hostvars[groups['all'][0]].join_command }}"

- hosts: all[0]
  become: yes
  tasks:
    - name: Install Cilium
      shell: |
        helm repo add cilium https://helm.cilium.io/ || true
        helm repo update
        helm install cilium cilium/cilium \
          --version 1.20.2 \
          --namespace kube-system \
          --set operator.replicas=1 \
          --set operator.nodeSelector."node-role\.kubernetes\.io/control-plane"="" \
          --set operator.tolerations[0].key=node-role.kubernetes.io/control-plane \
          --set operator.tolerations[0].operator=Exists \
          --set operator.tolerations[0].effect=NoSchedule \
          --set operator.tolerations[1].key=node.kubernetes.io/not-ready \
          --set operator.tolerations[1].operator=Exists \
          --set operator.tolerations[1].effect=NoSchedule \
          --set operator.tolerations[2].key=node.kubernetes.io/unreachable \
          --set operator.tolerations[2].operator=Exists \
          --set operator.tolerations[2].effect=NoExecute
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf